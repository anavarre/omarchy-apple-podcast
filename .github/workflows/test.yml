name: test

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository; the default token must not be able to
# write to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to a commit, so a moved tag cannot change
      # what runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install mpv, socat and shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv socat shellcheck
      - name: Lint
        run: |
          shellcheck -S warning bin/podcasts-api bin/podcasts-player tests/api.sh tests/player.sh tests/run
          python3 -m json.tool manifest.json > /dev/null
      - name: Tests
        run: CI=1 tests/run
